# Runs both test suites on every pull request and on main. Branch rules
# require these checks to pass before a PR can merge.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'tests/*.test.mjs'

  panel:
    name: Panel tests
    runs-on: ubuntu-latest
    # A plain Ubuntu container runs as root, so Qt's runtime libraries install
    # without privilege escalation anywhere in this repo.
    container: ubuntu:24.04
    env:
      # The Omarchy release whose Commons/Ui the panel is tested against.
      # Pinned so a change in Omarchy can't fail unrelated PRs; bump it when
      # a new stable Omarchy ships.
      OMARCHY_REF: v4.0.6
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git, Python and Qt's runtime libraries
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git python3 python3-venv \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - uses: actions/checkout@v4

      - name: Fetch Omarchy's shell components
        run: git clone --depth 1 --branch "$OMARCHY_REF" https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy"

      # Below 6.12: Qt 6.12's QtQuick exports its own `Color`, which shadows
      # Omarchy's in this harness (see AGENTS.md).
      - name: Install PySide6
        run: |
          python3 -m venv .venv-harness
          .venv-harness/bin/pip install -q 'PySide6>=6.10,<6.12'

      - name: Run the panel suite
        working-directory: tests
        env:
          OMARCHY_SHELL: ${{ runner.temp }}/omarchy/shell
        run: ../.venv-harness/bin/python -m unittest panel_test -v

      - name: No symlinks in the plugin (omarchy plugin validate rejects them)
        run: |
          found="$(git ls-files -s | awk '$1 == "120000" {print $4}')"
          [ -z "$found" ] || { echo "symlinks: $found"; exit 1; }
